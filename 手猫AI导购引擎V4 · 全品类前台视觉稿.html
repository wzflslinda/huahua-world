<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #1a1a2e; }

  /* Layout */
  .main-layout { display: flex; gap: 24px; padding: 24px; max-width: 1400px; margin: 0 auto; }
  .control-panel { width: 280px; flex-shrink: 0; background: #16213e; border-radius: 20px; padding: 20px; color: #fff; height: fit-content; position: sticky; top: 24px; }
  .phone-wrapper { flex: 1; display: flex; justify-content: center; }

  /* Control Panel */
  .cp-section { margin-bottom: 20px; }
  .cp-title { font-size: 11px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .cp-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .cp-btn { padding: 6px 12px; border-radius: 10px; font-size: 12px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; cursor: pointer; font-weight: 500; transition: all 0.15s; }
  .cp-btn:hover { border-color: #64748b; color: #e2e8f0; }
  .cp-btn.active { background: linear-gradient(135deg, #FF5000, #FF7000); color: #fff; border-color: #FF5000; }
  .cp-intent-btn { width: 100%; padding: 8px 12px; border-radius: 10px; font-size: 11px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; cursor: pointer; font-weight: 500; margin-bottom: 6px; text-align: left; display: flex; align-items: center; gap: 8px; transition: all 0.15s; }
  .cp-intent-btn:last-child { margin-bottom: 0; }
  .cp-intent-btn:hover { border-color: #64748b; }
  .cp-intent-btn.active { background: #2d1b00; border-color: #FF5000; color: #fff; }
  .cp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Phone Frame */
  .phone-frame { width: 390px; height: 844px; background: #fff; border-radius: 44px; box-shadow: 0 25px 80px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; position: relative; }
  .phone-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 126px; height: 34px; background: #000; border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; z-index: 1000; }
  .status-bar { height: 48px; background: #fff; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 6px 28px; font-size: 15px; font-weight: 600; color: #000; }
  .search-header { background: #fff; padding: 4px 12px 8px 12px; display: flex; align-items: center; gap: 8px; }
  .search-box { flex: 1; height: 34px; background: #f5f5f5; border-radius: 17px; display: flex; align-items: center; padding: 0 12px; gap: 6px; }
  .scroll-area { height: calc(100% - 48px - 46px - 64px); overflow-y: auto; background: #f5f5f5; }
  .scroll-area::-webkit-scrollbar { display: none; }

  /* AI Header */
  .ai-header { background: #fff; padding: 12px 12px 8px 12px; border-bottom: 1px solid #f0f0f0; }
  .ai-header-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .ai-avatar-small { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #FF5000, #FF9000); display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .ai-title-text { font-size: 14px; font-weight: 700; color: #333; display: flex; align-items: center; gap: 6px; }
  .ai-badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: linear-gradient(135deg, #FF5000, #FF9000); color: #fff; font-weight: 600; }
  .ai-content-text { font-size: 13px; line-height: 1.7; color: #333; margin-bottom: 10px; }
  .ai-content-text strong { color: #FF5000; font-weight: 600; }
  .key-point { display: inline-flex; align-items: center; gap: 2px; background: #fff5f0; color: #FF5000; padding: 0 5px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-right: 2px; }
  .brand-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
  .brand-pills::-webkit-scrollbar { display: none; }
  .brand-pill { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 58px; cursor: pointer; }
  .brand-pill-img { width: 48px; height: 48px; border-radius: 50%; background: #f8f8f8; object-fit: cover; border: 1px solid #f0f0f0; }
  .brand-pill-name { font-size: 11px; color: #666; white-space: nowrap; }
  .ai-action-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; border-top: 0.5px solid #f5f5f5; }
  .ai-chip { padding: 4px 10px; border-radius: 12px; font-size: 12px; border: 0.5px solid #e0e0e0; background: #fafafa; color: #666; cursor: pointer; }
  .ai-chip.active { background: #fff5f0; border-color: #FF5000; color: #FF5000; font-weight: 600; }
  .ai-go-btn { display: flex; align-items: center; gap: 2px; font-size: 13px; color: #999; cursor: pointer; }

  /* Filter Tabs */
  .filter-tabs { display: flex; align-items: center; background: #fff; padding: 0 12px; height: 40px; gap: 16px; border-bottom: 0.5px solid #f0f0f0; }
  .filter-tab { font-size: 13px; color: #666; white-space: nowrap; cursor: pointer; position: relative; }
  .filter-tab.active { color: #FF0036; font-weight: 600; }
  .filter-tab.active::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 16px; height: 2.5px; background: #FF0036; border-radius: 2px; }
  .filter-tab.ai-tab { display: flex; align-items: center; gap: 3px; background: linear-gradient(135deg, #FF5000, #FF9000); color: #fff; padding: 3px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }

  /* Promo Banner */
  .promo-banner { margin: 8px 12px; background: linear-gradient(90deg, #fff0f2, #fff5f0); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; }
  .promo-tag { background: #FF0036; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
  .promo-text { font-size: 12px; color: #333; font-weight: 500; }
  .promo-time { font-size: 11px; color: #FF0036; }

  /* Product Grid */
  .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 6px 80px 6px; }
  .product-card { background: #fff; border-radius: 12px; overflow: hidden; }
  .product-img-wrap { position: relative; width: 100%; aspect-ratio: 1; background: #f8f8f8; }
  .product-img { width: 100%; height: 100%; object-fit: cover; }
  .product-tag-618 { position: absolute; top: 8px; left: 8px; background: linear-gradient(135deg, #FF0036, #FF6B6B); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
  .product-info { padding: 8px; }
  .price-row { display: flex; align-items: baseline; gap: 2px; }
  .price-symbol { font-size: 11px; color: #FF0036; font-weight: 600; }
  .price-num { font-size: 18px; color: #FF0036; font-weight: 700; }
  .price-original { font-size: 11px; color: #999; text-decoration: line-through; margin-left: 4px; }
  .product-title { font-size: 12px; color: #333; line-height: 1.45; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; }
  .product-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; color: #999; }
  .product-sold { color: #999; }
  .product-shop { color: #999; display: flex; align-items: center; gap: 2px; }
  .product-tags-row { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .ptag { font-size: 10px; padding: 1px 4px; border-radius: 3px; font-weight: 500; }
  .ptag-red { background: #fff0f2; color: #FF0036; }
  .ptag-orange { background: #fff5e6; color: #FF6A00; }
  .ptag-green { background: #f0f9f0; color: #52c41a; }
  .ptag-gray { background: #f5f5f5; color: #999; }

  /* Inline AI Bubble */
  .ai-inline { grid-column: 1 / -1; background: #fff; border-radius: 14px; margin: 2px 0; padding: 12px; display: flex; gap: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
  .ai-inline-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #FF5000, #FF9000); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .ai-inline-body { flex: 1; }
  .ai-inline-text { font-size: 13.5px; line-height: 1.65; color: #333; }
  .ai-inline-text strong { color: #FF5000; font-weight: 600; }
  .ai-inline-options { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .ai-inline-btn { padding: 5px 12px; border-radius: 14px; font-size: 12px; border: 0.5px solid #ffd4b8; background: #fff8f3; color: #FF5000; font-weight: 500; cursor: pointer; }
  .ai-inline-btn:active { opacity: 0.7; }
  .ai-inline-btn.selected { background: #FF5000; color: #fff; border-color: #FF5000; }
  .intent-label { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-bottom: 6px; font-weight: 600; }
  .intent-a { background: #fff0e6; color: #ff7a00; }
  .intent-b { background: #e6f0ff; color: #0066ff; }
  .intent-c { background: #e6f7e6; color: #389e0d; }
  .intent-d { background: #fff0f0; color: #cf1322; }
  .intent-e { background: #fffbe6; color: #d48806; }
  .intent-f { background: #f0e6ff; color: #7c3aed; }
  .intent-g { background: #e6f7ff; color: #0891b2; }
  .intent-h { background: #fef3c7; color: #b45309; }
  .intent-i { background: #fce7f3; color: #db2777; }
  .intent-j { background: #d1fae5; color: #059669; }

  /* Bottom Tab Bar */
  .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-top: 0.5px solid #f0f0f0; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 6px; z-index: 1000; }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tab-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .tab-label { font-size: 10px; color: #999; }
  .tab-item.active .tab-label { color: #FF5000; }

  /* Animations */
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .anim-in { animation: slideUp 0.35s ease forwards; }

  /* Responsive */
  @media (max-width: 900px) { .main-layout { flex-direction: column; } .control-panel { width: 100%; position: static; } .phone-frame { width: 100%; max-width: 390px; height: 700px; } }
</style>

// ============ STATE ============
let industry = 'sports';
let kwType = 'knowledge';
let intent = 'enter';

// ============ RENDER ============
function render() {
  const data = industries[industry];
  const aiData = kwType === 'knowledge' ? data.knowledge : data.attribute;
  const container = document.getElementById('page-content');

  let html = '';

  // Header AI Guide (only for enter intent)
  if (intent === 'enter') {
    html += renderHeaderAI(aiData);
  }

  // Filter Tabs
  html += renderFilterTabs();

  // Promo Banner
  html += renderPromoBanner();

  // Product Grid
  html += '<div class="product-grid">';
  const prods = data.products;

  // First 2 products
  html += renderProduct(prods[0], 0);
  html += renderProduct(prods[1], 1);

  // Inline AI for non-enter intents
  if (intent !== 'enter') {
    html += renderInlineAI(intent, aiData);
  }

  // Next products
  for (let i = 2; i < Math.min(prods.length, 8); i++) {
    html += renderProduct(prods[i], i);

    // Insert second AI bubble for A/B intents after 4th product
    if (i === 3 && (intent === 'A' || intent === 'B')) {
      html += renderInlineAI(intent === 'A' ? 'A2' : 'B2', aiData);
    }
  }

  html += '</div>';
  container.innerHTML = html;

  // Update search text
  document.getElementById('search-text').textContent = aiData.keyword;

  // Scroll to top
  document.getElementById('scroll-area').scrollTop = 0;
}

function renderHeaderAI(aiData) {
  const brandPills = aiData.brands.map(b => `
    <div class="brand-pill">
      <img src="${b.img}" class="brand-pill-img" alt="">
      <span class="brand-pill-name">${b.name}</span>
    </div>
  `).join('');

  const chipsHtml = aiData.chips.map((c, i) =>
    `<span class="ai-chip ${i === 0 ? 'active' : ''}">${c}</span>`
  ).join('');

  return `
    <div class="ai-header anim-in">
      <div class="ai-header-top">
        <div class="ai-avatar-small">🐱</div>
        <div class="ai-title-text">
          天猫AI导购员
          <span class="ai-badge">AI</span>
        </div>
      </div>
      <div class="ai-content-text">${aiData.text}</div>
      <div class="brand-pills">${brandPills}</div>
      <div class="ai-action-bar">
        <div class="ai-action-left">${chipsHtml}</div>
        <div class="ai-go-btn">去看看 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
    </div>
  `;
}

function renderFilterTabs() {
  const tabs = ['综合', '销量', '价格', '店铺', '筛选'];
  const tabsHtml = tabs.map((t, i) =>
    `<span class="filter-tab ${i === 0 ? 'active' : ''}">${t}</span>`
  ).join('');

  return `
    <div class="filter-tabs">
      ${tabsHtml}
      <span class="filter-tab ai-tab"> AI搜一下</span>
    </div>
  `;
}

function renderPromoBanner() {
  return `
    <div class="promo-banner anim-in">
      <div class="promo-left">
        <span class="promo-tag">618抢先购</span>
        <span class="promo-text">8.5折起 · 官方立减</span>
      </div>
      <span class="promo-time">消费券 00:11:13后失效</span>
    </div>
  `;
}

function renderProduct(p, idx) {
  const tagsHtml = p.tags.map(t => `<span class="ptag ptag-${t.c}">${t.t}</span>`).join('');
  return `
    <div class="product-card anim-in" style="animation-delay:${idx*0.04}s">
      <div class="product-img-wrap">
        <img src="${p.img}" class="product-img" alt="">
        <span class="product-tag-618">618抢先购</span>
      </div>
      <div class="product-info">
        <div class="price-row">
          <span class="price-symbol">¥</span>
          <span class="price-num">${p.price}</span>
          <span class="price-original">¥${p.original}</span>
        </div>
        <p class="product-title">${p.title}</p>
        <div class="product-meta">
          <span class="product-sold">${p.sold}</span>
          <span class="product-shop">${p.shop}</span>
        </div>
        <div class="product-tags-row">${tagsHtml}</div>
      </div>
    </div>
  `;
}

function renderInlineAI(intentType, aiData) {
  const content = getIntentContent(intentType, aiData);
  const labelHtml = content.label ? `<span class="intent-label ${content.label}">${content.labelText}</span>` : '';
  const optsHtml = content.options.map(opt =>
    `<button class="ai-inline-btn" onclick="this.classList.toggle('selected')">${opt}</button>`
  ).join('');

  return `
    <div class="ai-inline anim-in">
      <div class="ai-inline-avatar">🐱</div>
      <div class="ai-inline-body">
        ${labelHtml}
        <p class="ai-inline-text">${content.text}</p>
        <div class="ai-inline-options">${optsHtml}</div>
      </div>
    </div>
  `;
}

  // Use sports templates as default for other industries

}

// ============ CONTROLS ============
function setIndustry(newIndustry) {
  industry = newIndustry;
  intent = 'enter';
  updateControls();
  render();
}

function setKWType(newType) {
  kwType = newType;
  updateControls();
  render();
}

function setIntent(newIntent) {
  intent = newIntent;
  updateControls();
  render();
}

function updateControls() {
  // Industry buttons
  document.querySelectorAll('#industry-btns .cp-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  // KW type buttons
  document.querySelectorAll('#kw-type-btns .cp-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('cp-kw-' + kwType).classList.add('active');

  // Intent buttons
  document.querySelectorAll('.cp-intent-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('cp-int-' + intent).classList.add('active');
}

// ============ INIT ============
render();
</script>
